name: vprofile actions                                                  # GitHub Actions workflow for Java app CI/CD
on: workflow_dispatch                                                   # Manual trigger for on-demand execution

env:
  AWS_REGION: us-east-2                                                 # Target AWS region for deployment
  ECR_REPOSITORY: vprofileapp                                           # ECR repository name for container images
  EKS_CLUSTER: vprofile-eks                                             # EKS cluster name for Kubernetes deployment

jobs:
  Testing:
    runs-on: ubuntu-latest                                              # Use latest Ubuntu GitHub runner
    steps:
      - name: Code checkout
        uses: actions/checkout@v4                                       # Checkout source code from repository

      - name: Maven test
        run: mvn test                                                   # Run unit tests using Maven

      - name: Checkstyle
        run: mvn checkstyle:checkstyle                                  # Run code style validation with Checkstyle

      # Setup java 11 to be default (sonar-scanner requirement as of 5.x)
      - name: Set Java 11
        uses: actions/setup-java@v3                                     # Install Java 11 for SonarQube compatibility
        with:
          distribution: 'temurin'                                       # Use Eclipse Temurin JDK distribution
          java-version: '11'                                            # Specify Java version 11

      # Setup sonar-scanner
      - name: Setup SonarQube
        uses: warchant/setup-sonar-scanner@v7                          # Install SonarQube scanner CLI tool

      # Run sonar-scanner
      - name: SonarQube Scan
        run: |                                                          # Execute SonarQube code analysis
          sonar-scanner \
            -Dsonar.host.url=${{ secrets.SONAR_URL }} \                 # SonarQube server URL from secrets
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \                  # Authentication token from secrets
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \    # SonarQube organization identifier
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \       # Unique project key for analysis
            -Dsonar.sources=src/ \                                      # Source code directory to analyze
            -Dsonar.junit.reportsPath=target/surefire-reports/ \        # JUnit test results location
            -Dsonar.jacoco.reportsPath=target/jacoco.exec \             # Code coverage report file
            -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml \ # Checkstyle report location
            -Dsonar.java.binaries=target/test-classes/com/visualpathit/account/controllerTest/ # Compiled test classes

      # Check the Quality Gate status.
      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check                                # Step ID for referencing in other steps
        uses: sonarsource/sonarqube-quality-gate-action@master         # Official SonarQube quality gate action
        # Force to fail step after specific time.
        timeout-minutes: 5                                              # Maximum wait time for quality gate result
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}                       # SonarQube authentication token
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}                      # SonarQube server URL (optional)

  BUILD_AND_PUBLISH:
    needs: Testing                                                      # Wait for Testing job to complete successfully
    runs-on: ubuntu-latest                                              # Use latest Ubuntu GitHub runner
    steps:
      - name: Code checkout
        uses: actions/checkout@v4                                       # Checkout source code from repository

      - name: Build & Upload image to ECR
        uses: appleboy/docker-ecr-action@master                        # Third-party action for ECR operations
        with:
          access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}                  # AWS access key from GitHub secrets
          secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}              # AWS secret key from GitHub secrets
          registry: ${{ secrets.REGISTRY }}                             # ECR registry URL from secrets
          repo: ${{ env.ECR_REPOSITORY }}                               # ECR repository name from environment
          region: ${{ env.AWS_REGION }}                                 # AWS region from environment variable
          tags: latest,${{ github.run_number }}                        # Tag with latest and build number
          daemon_off: false                                             # Keep Docker daemon running
          dockerfile: ./Dockerfile                                      # Dockerfile location in repository
          context: ./                                                   # Build context directory
 