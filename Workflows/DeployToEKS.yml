name: vprofile actions                                                  # CI/CD pipeline for vprofile application
on: workflow_dispatch                                                   # Manual trigger (on-demand execution)

env:
  AWS_REGION: us-east-2                                                 # AWS region for all resources
  ECR_REPOSITORY: vprofileapp                                           # ECR repository name for app images
  EKS_CLUSTER: vprofile-eks                                             # Target EKS cluster name

jobs:
  Testing:
    runs-on: ubuntu-latest                                              # GitHub-hosted Ubuntu runner
    steps:
      - name: Code checkout
        uses: actions/checkout@v4                                       # Checkout repository source code

      - name: Maven test
        run: mvn test                                                   # Run unit tests using Maven

      - name: Checkstyle
        run: mvn checkstyle:checkstyle                                  # Run code style validation with Checkstyle

      - name: Set Java 11
        uses: actions/setup-java@v3                                     # Setup Java (required for SonarQube scanner)
        with:
          distribution: 'temurin'                                       # Eclipse Temurin build of OpenJDK
          java-version: '11'                                            # Set Java version to 11

      - name: Setup SonarQube
        uses: warchant/setup-sonar-scanner@v7                           # Install SonarQube scanner CLI

      - name: SonarQube Scan
        run: |                                                          # Perform code analysis with SonarQube
          sonar-scanner \
            -Dsonar.host.url=${{ secrets.SONAR_URL }} \                 # SonarQube server URL
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \                  # Authentication token
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \    # SonarQube org
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \       # Project key identifier
            -Dsonar.sources=src/ \                                      # Source code directory
            -Dsonar.junit.reportsPath=target/surefire-reports/ \        # JUnit test report location
            -Dsonar.jacoco.reportsPath=target/jacoco.exec \             # Code coverage (JaCoCo) report
            -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml \ # Checkstyle report
            -Dsonar.java.binaries=target/test-classes/com/visualpathit/account/controllerTest/ # Compiled test binaries path

      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check                                # Step ID for referencing
        uses: sonarsource/sonarqube-quality-gate-action@master           # SonarQube Quality Gate validation action
        timeout-minutes: 5                                              # Fail if no result within 5 minutes
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}                       # Sonar token for auth
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}                      # SonarQube server (optional)

  BUILD_AND_PUBLISH:
    needs: Testing                                                      # Run only if Testing job succeeds
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4                                       # Checkout repo again for Docker build

      - name: Build & Upload image to ECR
        uses: appleboy/docker-ecr-action@master                         # Build and push Docker image to ECR
        with:
          access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}                  # AWS access key
          secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}              # AWS secret key
          registry: ${{ secrets.REGISTRY }}                             # AWS ECR registry URL
          repo: ${{ env.ECR_REPOSITORY }}                               # ECR repository name
          region: ${{ env.AWS_REGION }}                                 # AWS region
          tags: latest,${{ github.run_number }}                         # Create latest & build number tags
          daemon_off: false                                             # Keep Docker daemon running
          dockerfile: ./Dockerfile                                      # Use top-level Dockerfile
          context: ./                                                   # Build context is project root

  DeployToEKS:
    needs: BUILD_AND_PUBLISH                                            # Run only after Docker image is uploaded
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4                                       # Checkout for Helm deployment files

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1                  # Configure AWS CLI with GitHub secrets
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}           # AWS access key
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}   # AWS secret key
          aws-region: ${{ env.AWS_REGION }}                             # AWS region

      - name: Get Kube config file
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }} # Configure kubectl

      - name: Print config file
        run: cat ~/.kube/config                                         # Debug step to confirm kubeconfig

      - name: Login to ECR
        run: kubectl create secret docker-registry regcred \
              --docker-server=${{ secrets.REGISTRY }} \
              --docker-username=AWS \
              --docker-password=$(aws ecr get-login-password)           # Create Kubernetes secret for ECR registry auth

      - name: Deploy Helm
        uses: bitovi/github-actions-deploy-eks-helm@v1.2.8              # Deploy application using Helm on EKS
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}           # AWS access key for Helm action
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}   # AWS secret key for Helm action
          aws-region: ${{ env.AWS_REGION }}                             # AWS region
          cluster-name: ${{ env.EKS_CLUSTER }}                          # Target EKS cluster name
          chart-path: helm/vprofilecharts                               # Helm chart path inside repo
          namespace: default                                            # Deploy to default namespace
          values: appimage=${{ secrets.REGISTRY }}/${{ env.ECR_REPOSITORY }},apptag=${{ github.run_number }} # Helm values (image + tag)
          name: vprofile-stack                                          # Release name for Helm deployment
