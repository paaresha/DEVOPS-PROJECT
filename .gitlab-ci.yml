variables:
  DOCKER_REGISTRY: $CI_REGISTRY              # Use GitLab's container registry 
  IMAGE_NAME: $CI_REGISTRY_IMAGE             # Full image path with registry
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository" # Local Maven repository path

stages:                                      # Pipeline execution order
  - build                                    # Compile and package application
  - unit-test                                # Run unit tests
  - checkstyle                               # Code style validation
  - sonar-analysis                           # Static code analysis
  - quality-gate                             # SonarQube quality gate check
  - docker-build                             # Build and push Docker image
  - update-deployment                        # Update Helm chart with new image

cache:                                       # Cache Maven dependencies
  paths:
    - .m2/repository/

build:
  stage: build
  image: maven:3.9-eclipse-temurin-21        # Java 21 with Maven 3.9
  script:
    - export MAVEN_OPTS="-Xmx512m -Xms256m"  # JVM memory settings
    - mvn clean install -DskipTests           # Build without running tests
  artifacts:
    paths:
      - target/                              # Save compiled artifacts
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" # Run on MRs
    - if: $CI_COMMIT_BRANCH == "main"        # Run on main branch

unit-test:
  stage: unit-test
  image: maven:3.9-eclipse-temurin-21
  script:
    - export MAVEN_OPTS="-Xmx512m -Xms256m"
    - mvn test                               # Execute unit tests
  artifacts:
    reports:
      junit: target/surefire-reports/TEST-*.xml # JUnit test reports
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

checkstyle:
  stage: checkstyle
  image: maven:3.9-eclipse-temurin-21
  script:
    - export MAVEN_OPTS="-Xmx512m -Xms256m"
    - mvn checkstyle:checkstyle              # Run code style checks
  artifacts:
    paths:
      - target/checkstyle-result.xml         # Save checkstyle report
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

sonar-analysis:
  stage: sonar-analysis
  image: sonarsource/sonar-scanner-cli:latest # Official SonarQube scanner
  script:
    - |
      sonar-scanner -Dsonar.login=$LOGIN \   # SonarQube authentication
        -Dsonar.host.url=$HOST \             # SonarQube server URL
        -Dsonar.projectKey=$Project \        # Unique project identifier
        -Dsonar.organization=$Organization \ # SonarCloud organization
        -Dsonar.projectName=vprofile-repo \  # Display name
        -Dsonar.projectVersion=1.0 \         # Project version
        -Dsonar.sources=src/ \               # Source code location
        -Dsonar.java.binaries=target/classes/com/visualpathit/account/controller/ \ # Compiled classes
        -Dsonar.junit.reportsPath=target/surefire-reports/ \ # Test reports
        -Dsonar.jacoco.reportsPath=target/jacoco.exec \ # Code coverage data
        -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml # Style violations
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

quality-gate:
  stage: quality-gate
  image: curlimages/curl:latest              # Lightweight image with curl
  script:
    - #|  Uncomment this line if you want to run this code
      echo "Checking Quality Gate status..."
      i=0
      while [ $i -lt 30 ]; do               # 30 iteration limit (5 minutes)
        RESPONSE=$(curl -s -u $LOGIN: "$HOST/api/qualitygates/project_status?projectKey=$Project") # Query SonarQube API
        echo "API Response: $RESPONSE"
        STATUS=$(echo "$RESPONSE" | grep -o '"status":"[^"]*' | head -1 | cut -d'"' -f4) # Extract status
        echo "Extracted Status: [$STATUS]"
        echo "Status length: ${#STATUS}"
        case "$STATUS" in
          "OK")
            echo "Quality Gate PASSED"       # Analysis passed all conditions
            exit 0
            ;;
          "ERROR")
            echo "Quality Gate FAILED"       # Analysis failed quality conditions
            exit 1
            ;;
          *)
            echo "Status not recognized or still processing: [$STATUS]" # Unknown/pending status
            ;;
        esac
        echo "Waiting for analysis to complete..."
        sleep 10                             # Wait 10 seconds between checks
        i=$((i + 1))
      done
      echo "Quality Gate check timed out"    # Exceeded retry limit
      exit 1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

docker-build-push:
  stage: docker-build
  image: docker:latest                       # Docker CLI image
  services:
    - docker:dind                            # Docker-in-Docker service
  script:
    - echo "=== DEBUG VARIABLES ==="
    - echo "CI_REGISTRY=$CI_REGISTRY"
    - echo "CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE"
    - echo "IMAGE_NAME=$IMAGE_NAME"
    - echo "CI_COMMIT_SHA=$CI_COMMIT_SHA"
    - echo "CI_REGISTRY_USER=$CI_REGISTRY_USER"
    - echo "========================"
    - docker build -t $IMAGE_NAME:$CI_COMMIT_SHA -f Docker-files/app/multistage/Dockerfile . # Build with commit SHA tag
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY # Login to GitLab registry
    - docker push $IMAGE_NAME:$CI_COMMIT_SHA # Push tagged image
    - docker rmi $IMAGE_NAME:$CI_COMMIT_SHA || true # Cleanup local image
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

update-deployment:
  stage: update-deployment
  image: alpine:latest
  variables:
    GIT_STRATEGY: none                       # Don't clone current repo
  script:
    - set -e                                 # Exit on any error
    - apk add --no-cache git                 # Install git client
    - echo "=== DEBUG VARIABLES ==="
    - echo "CHARTS_REPO_URL=>$CHARTS_REPO_URL"
    - echo "IMAGE_NAME=$IMAGE_NAME"
    - echo "CI_COMMIT_SHA=$CI_COMMIT_SHA"
    - echo "========================"
    - git config --global user.email "gitlab-ci@example.com" # Set git user
    - git config --global user.name "GitLab CI"
    - git clone https://oauth2:${CHARTS_REPO_TOKEN}@${CHARTS_REPO_URL} charts-repo # Clone Helm charts repo
    - cd charts-repo
    - 'sed -i "/^app:/,/^[a-z]/ s|image:.*|image: ${IMAGE_NAME}|" vprofile-charts/values.yaml' # Update image name
    - 'sed -i "/^app:/,/^[a-z]/ s|tag
    - git add vprofile-charts/values.yaml
    - git commit -m "Update image to ${CI_COMMIT_SHA}" || echo "No changes to commit"
    - git push origin main
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
